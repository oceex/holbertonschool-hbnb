<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB — Log in</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
          <a href="index.html" ><img src="images/logo.png" alt="HBnB logo" class="logo"></a>
      </div>
      <nav class="main-nav" aria-label="Primary">
        <a href="login.html" class="login-button">Log in</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-shell">
      <span class="eyebrow">Welcome back</span>
      <h1>Log in to HBnB</h1>
      <p>Sign in to leave a review or book your next stay.</p>

      <form class="form" action="#" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit" class="form-submit">Log in</button>
      </form>

      <p class="form-note">New here? Ask your host for an invite.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 HBnB. All rights reserved.</p>
      <nav aria-label="Footer">
        <a href="index.html">Places</a>
      </nav>
    </div>
  </footer>

</body>
</html>
