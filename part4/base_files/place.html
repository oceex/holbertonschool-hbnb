<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details · hbnb</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <img src="images/logo.png" alt="hbnb home" class="logo">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link" class="login-button">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">&larr; Back to all places</a>

        <section id="place-details" class="place-details">
            <!-- Place details will be populated dynamically -->
        </section>

        <section id="reviews" class="reviews-section">
            <h2>Reviews</h2>
            <div id="reviews-list" class="reviews-list">
                <!-- Reviews will be populated dynamically -->
            </div>
        </section>

        <section id="add-review" class="add-review-section">
            <!-- Add-review form or login prompt populated dynamically -->
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 hbnb. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
