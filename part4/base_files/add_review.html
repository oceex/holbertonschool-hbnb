<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB — Add a review</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
          <a href="index.html" ><img src="images/logo.png" alt="HBnB logo" class="logo"></a>
      </div>
      <nav class="main-nav" aria-label="Primary">
        <a href="login.html" class="login-button">Log in</a>
      </nav>
    </div>
  </header>

  <main>
    <p class="place-context">Reviewing <strong>Cliffside Cabin</strong>, Big Sur, California — <a href="place.html">back to place</a></p>

    <section class="form-shell">
      <span class="eyebrow">Leave a review</span>
      <h1>Tell future guests how it went</h1>
      <p>Only guests who have signed in can post a review.</p>

      <form class="add-review form" action="#" method="post">
        <label for="rating">Rating</label>
        <select id="rating" name="rating" required>
          <option value="">Choose a rating</option>
          <option value="5">★★★★★ — Excellent</option>
          <option value="4">★★★★☆ — Great</option>
          <option value="3">★★★☆☆ — Good</option>
          <option value="2">★★☆☆☆ — Fair</option>
          <option value="1">★☆☆☆☆ — Poor</option>
        </select>

        <label for="comment">Your review</label>
        <textarea id="comment" name="comment" placeholder="What was the place like? What should the next guest know?" required></textarea>

        <button type="submit" class="form-submit">Submit review</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 HBnB. All rights reserved.</p>
      <nav aria-label="Footer">
        <a href="index.html">Places</a>
      </nav>
    </div>
  </footer>

</body>
</html>
